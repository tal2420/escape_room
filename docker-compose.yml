version: '3.8'

# ארכיטקטורה עצמאית — ה-container משכפל את הרפו בעצמו.
# אין bind mounts = אין תלות בהגדרות Portainer, אין BuildKit.
# כל restart מושך את הגרסה האחרונה מ-GitHub (git reset --hard).

services:
  escape-room:
    image: node:20-slim
    container_name: escape-room
    working_dir: /app
    ports:
      - "8080:3000"
    volumes:
      - escape-room-app:/app
      - escape-room-data:/data
    environment:
      - PORT=3000
      - DB_PATH=/data/scores.db
      - NODE_ENV=production
      - REPO_URL=https://github.com/tal2420/escape_room.git
      - FORCE_UPDATE=1
    command:
      - bash
      - -c
      - |
        set +e
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎮 Escape Room boot @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        # ── התקנת חבילות מערכת (פעם אחת) ──
        if [ ! -f /app/.deps-installed ]; then
          echo "📥 Installing system packages (first run)..."
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3 make g++
          rm -rf /var/lib/apt/lists/*
          touch /app/.deps-installed
          echo "✅ System packages installed"
        else
          echo "✅ System packages cached"
        fi

        # ── שכפול או עדכון מהרפו ──
        if [ ! -d /app/.git ]; then
          echo "📥 First-time repository clone..."
          rm -rf /tmp/repo
          git clone "$REPO_URL" /tmp/repo
          cp -r /tmp/repo/. /app/
          rm -rf /tmp/repo
          echo "✅ Cloned from $REPO_URL"
        else
          echo "🔄 Forcing update from origin/main..."
          cd /app
          git remote set-url origin "$REPO_URL"
          git fetch origin main
          FETCH_STATUS=$?
          if [ $FETCH_STATUS -ne 0 ]; then
            echo "⚠️  git fetch FAILED (exit $FETCH_STATUS). Re-cloning..."
            cd /
            rm -rf /app/.git /app/escape-room.html /app/server.js /app/package.json /app/docker-compose.yml /app/fred.jpg /app/README.md /app/DEPLOY.md /app/Dockerfile /app/.gitignore 2>/dev/null
            rm -rf /tmp/repo
            git clone "$REPO_URL" /tmp/repo
            cp -r /tmp/repo/. /app/
            rm -rf /tmp/repo
          else
            git reset --hard origin/main
            git clean -fd
          fi
          echo "📍 Now at commit: $(cd /app && git rev-parse --short HEAD 2>/dev/null)"
        fi

        cd /app
        set -e

        # ── בדיקת package.json ו-npm install ──
        PKG_HASH=$(sha1sum package.json | cut -d' ' -f1)
        STORED_HASH=$(cat /app/node_modules/.pkg-hash 2>/dev/null || echo "none")
        if [ "$PKG_HASH" != "$STORED_HASH" ] || [ ! -d /app/node_modules/better-sqlite3 ]; then
          echo "📦 Installing Node dependencies..."
          npm install --production --no-audit --no-fund
          mkdir -p /app/node_modules
          echo "$PKG_HASH" > /app/node_modules/.pkg-hash
          echo "✅ Node dependencies installed"
        else
          echo "✅ Node dependencies cached"
        fi

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎮 Starting Escape Room server..."
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        exec node server.js
    restart: unless-stopped
    labels:
      - "com.game.name=EscapeRoom"

volumes:
  escape-room-app:
  escape-room-data:
