version: '3.8'

# ארכיטקטורה עצמאית — ה-container משכפל את הרפו בעצמו.
# אין bind mounts = אין תלות בהגדרות Portainer, אין BuildKit.
# כל restart מושך את הגרסה האחרונה מ-GitHub (git reset --hard).

services:
  escape-room:
    image: node:20-slim
    container_name: escape-room
    working_dir: /app
    ports:
      - "8080:3000"   # גישה דרך http://192.168.1.200:8080
    volumes:
      - escape-room-app:/app     # הרפו נשמר ב-volume
      - escape-room-data:/data   # SQLite שורד restart
    environment:
      - PORT=3000
      - DB_PATH=/data/scores.db
      - NODE_ENV=production
    command: >
      bash -c "
        set -e;
        echo '🔧 Setting up environment...';

        if [ ! -f /app/.deps-installed ]; then
          echo '📥 Installing system packages (one-time)...';
          apt-get update -qq;
          apt-get install -y -qq --no-install-recommends git ca-certificates python3 make g++;
          rm -rf /var/lib/apt/lists/*;
          touch /app/.deps-installed;
        fi;

        if [ ! -d /app/.git ]; then
          echo '📥 Cloning repository...';
          rm -rf /tmp/repo;
          git clone https://github.com/tal2420/escape_room.git /tmp/repo;
          cp -r /tmp/repo/. /app/;
          rm -rf /tmp/repo;
        else
          echo '🔄 Pulling latest from GitHub...';
          cd /app && git fetch --quiet origin && git reset --hard origin/main || echo '(pull skipped)';
        fi;

        cd /app;
        if [ ! -d /app/node_modules/better-sqlite3 ]; then
          echo '📦 Installing Node dependencies...';
          npm install --production --no-audit --no-fund;
        fi;

        echo '🎮 Starting Escape Room server...';
        exec node server.js
      "
    restart: unless-stopped
    labels:
      - "com.game.name=EscapeRoom"

volumes:
  escape-room-app:
  escape-room-data:
